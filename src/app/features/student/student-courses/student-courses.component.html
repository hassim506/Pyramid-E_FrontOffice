<!-- src/app/features/student/student-courses/student-courses.component.html -->

<div class="row" *ngIf="!loading">

  <div
    class="col-xl-4 col-lg-6 col-md-6 mb-4"
    *ngFor="let formation of tableData">

    <div class="course-card h-100">

      <!-- IMAGE -->
      <div class="course-image">
        <img
          [src]="formation.image_couverture || 'assets/img/course/course-01.jpg'"
          class="img-fluid"
          alt="course">
      </div>

      <!-- CONTENT -->
      <div class="course-content d-flex flex-column">

        <span class="badge bg-light mb-2">
          {{ formation.difficulte }}
        </span>

        <h5 class="course-title">
          {{ formation.titre }}
        </h5>

        <p class="course-desc flex-grow-1">
          {{ formation.short_description }}
        </p>

        <div class="course-meta mb-3">
          <span>
            <i class="isax isax-clock"></i>
            {{ formation.duree_totale }} h
          </span>
          <span>
            <i class="isax isax-global"></i>
            {{ formation.langue }}
          </span>
        </div>

        <div class="course-footer d-flex justify-content-between align-items-center">
          <span class="fw-semibold">
            {{ formation.prix > 0 ? formation.prix + ' FCFA' : 'Gratuit' }}
          </span>

          <button
            class="btn btn-primary btn-sm"
            (click)="goToDetails(formation.id)">
            Voir plus
            <i class="isax isax-arrow-right-3 ms-1"></i>
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- EMPTY -->
  <div *ngIf="tableData.length === 0" class="text-center py-5 w-100">
    <p class="text-muted">Aucune formation disponible</p>
  </div>

</div>

<div *ngIf="loading" class="text-center py-5">
  Chargement...
</div>
